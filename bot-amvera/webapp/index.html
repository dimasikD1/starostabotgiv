/* Полировка интерфейса: доступность, статус пары и офлайн-режим */
body{padding-top:calc(12px + env(safe-area-inset-top))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status-chip{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:8px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--text)}
.status-chip.live{background:#17382b;border-color:#2c6b4f;color:#9df0c5}
.status-chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:softPulse 1.8s infinite}
.offline-banner{margin:0 0 12px;padding:9px 12px;border-radius:12px;border:1px solid #6b552c;background:#3a2f18;color:#ffe2a8;font-size:12px;font-weight:600}
.bottomnav{background:#10101d;background:color-mix(in srgb,var(--bg) 90%,transparent)}
.navitem.active{background:var(--panel2);color:var(--text)}
.tab.active{background:var(--panel2);border-color:var(--accent);color:var(--text)}
.toast{background:var(--panel2);border-color:var(--line);color:var(--text)}

/* Полировка: микроанимации и плавность. Только transform/opacity/цвета —
   на вёрстку и логику не влияют. */
#app .institution-hero,#app .status-chip,#app .offline-banner{animation:cardReveal .34s ease-out both}
#app .home-lesson,#app .schedule-lesson{animation:cardReveal .3s ease-out both}
#app .home-timeline .home-lesson:nth-child(2),#app .schedule-timeline .schedule-lesson:nth-child(2){animation-delay:.045s}
#app .home-timeline .home-lesson:nth-child(3),#app .schedule-timeline .schedule-lesson:nth-child(3){animation-delay:.09s}
#app .home-timeline .home-lesson:nth-child(4),#app .schedule-timeline .schedule-lesson:nth-child(4){animation-delay:.135s}
#app .home-timeline .home-lesson:nth-child(5),#app .schedule-timeline .schedule-lesson:nth-child(5){animation-delay:.18s}
#app .home-timeline .home-lesson:nth-child(n+6),#app .schedule-timeline .schedule-lesson:nth-child(n+6){animation-delay:.22s}
.card,.quick-action,.lesson,.student,.stat,.softbtn,.refresh,.tab,.navitem,.home-lesson,.schedule-lesson,.status-chip,.institution-hero,.bottomnav{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background-color .25s ease,color .25s ease}
#app .card.action:active,#app .quick-action:active,#app .softbtn:active,#app .refresh:active,#app .tab:active,#app .navitem:active,#app .home-lesson:active,#app .schedule-lesson:active,#app .lesson:active,#app .student:active{transform:scale(.98)}

@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.toast{transition:transform .25s ease,opacity .25s ease}
.toast.show{animation:toastIn .28s cubic-bezier(.2,.9,.3,1.15)}

<script>
(function(){
  var app=document.getElementById('app');
  function show(message){if(app){var box=document.getElementById('early-diagnostic');if(!box){box=document.createElement('div');box.id='early-diagnostic';box.style.cssText='margin-top:12px;padding:10px;border:1px solid #52658e;border-radius:10px;color:#dce5ff;font-size:13px;white-space:pre-wrap';app.appendChild(box)}box.textContent=message}}
  window.addEventListener('error',function(e){show('Ошибка JavaScript: '+(e.message||'неизвестная ошибка')+(e.lineno?' (строка '+e.lineno+')':''));console.error('[miniapp early error]',e.message,e.filename,e.lineno)});
  window.addEventListener('unhandledrejection',function(e){show('Ошибка выполнения: '+String(e.reason&&e.reason.message||e.reason));console.error('[miniapp early rejection]',e.reason)});
  setTimeout(function(){if(!window.__miniAppStage)show('Основной скрипт не запустился. Проверьте подключение Telegram SDK и ошибки JavaScript.')},1500);
  var sdk=document.querySelector('script[src*="telegram-web-app.js"]');
  if(sdk)sdk.addEventListener('error',function(){show('Не удалось загрузить Telegram WebApp SDK')});
})();
</script>
<script>
console.log('[miniapp] JavaScript started');
let tg=null,state=null,selectedKey=null,loading=false,saving=false,currentTab='home',studentQuery='',attendanceFilter='all',studentAttendanceFilter='all',announcementDraft='',telegramChats=[],selectedTelegramChatId='',chatAnnouncementDraft='';let homeworkMediaDraft=[],homeworkMediaUploading=false,homeworkMediaUrls={},homeworkMediaPending={},homeworkMediaEditingId=null,homeworkMediaEditDraft=[];let homeworkSubjectFilter='all';
let profileEditing=false,profileDraft='';
let scheduleRange='today',eventDraft={title:'',date:'',time:'',type:'exam',description:''};
const root=document.getElementById('app');
function toast(message,type='ok'){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}el.textContent=message;el.className='toast show '+type;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function haptic(kind='light'){try{tg?.HapticFeedback?.impactOccurred(kind)}catch{}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initTelegram(){tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand();return true}return false}
function setDiagnostic(stage){window.__miniAppStage=stage;console.log('[miniapp]',stage);const el=document.getElementById('load-stage');if(el)el.textContent=stage}
async function waitForTelegram(){
 setDiagnostic('Подключаем Telegram WebApp…');
 const started=Date.now();let nextRetry=0,retries=0;
 while(Date.now()-started<20000){
  if(initTelegram()){
   setDiagnostic(tg?.initData?'Telegram подключён, авторизация получена':'Telegram подключён, initData отсутствует');
   return true;
  }
  if(Date.now()>=nextRetry&&retries<4){
   const script=document.createElement('script');
   script.src='/telegram-web-app.js?retry='+retries;
   script.async=true;
   script.onerror=()=>console.warn('[miniapp] Telegram SDK load attempt failed',retries);
   document.head.appendChild(script);
   retries++;nextRetry=Date.now()+4000;
   setDiagnostic('Повторно подключаем Telegram SDK ('+retries+'/4)…');
  }
  await new Promise(r=>setTimeout(r,250));
 }
 setDiagnostic('Telegram SDK не найден после повторных попыток');
 return initTelegram();
}

const STATE_CACHE_KEY='starosta-miniapp-state-v1';

const THEME_STORAGE_KEY='starosta-miniapp-themes-v1';
const THEME_DEFAULT={name:'Ночная',bg:'#10101d',panel:'#1b1b2d',panel2:'#28263e',line:'#302d49',text:'#f7f5ff',muted:'#aaa5c5',accent:'#9658ff',image:''};
const THEME_PRESETS=[
 {name:'Ночная',bg:'#10101d',panel:'#1b1b2d',panel2:'#28263e',line:'#302d49',text:'#f7f5ff',muted:'#aaa5c5',accent:'#9658ff'},
 {name:'Графит',bg:'#171717',panel:'#222222',panel2:'#303030',line:'#444444',text:'#f5f5f5',muted:'#b5b5b5',accent:'#f0a35e'},
 {name:'Океан',bg:'#071b2b',panel:'#102b40',panel2:'#183b55',line:'#28516b',text:'#eaf7ff',muted:'#9bb9cc',accent:'#43c6d9'},
 {name:'Лес',bg:'#101d18',panel:'#1a2b22',panel2:'#263c30',line:'#365543',text:'#effaf1',muted:'#a7c0ad',accent:'#72c58a'},
 {name:'Лаванда',bg:'#191426',panel:'#28213a',panel2:'#362d4c',line:'#4b4064',text:'#f7f0ff',muted:'#c0b2d5',accent:'#bd9cff'}
];
function readThemes(){try{const v=JSON.parse(localStorage.getItem(THEME_STORAGE_KEY)||'{}');return{active:v.active||'Ночная',custom:Array.isArray(v.custom)?v.custom:[]}}catch{return{active:'Ночная',custom:[]}}}
let themeStore=readThemes(),themeDraftImage='';
function allThemes(){return [...THEME_PRESETS,...themeStore.custom]}
function persistThemes(){try{localStorage.setItem(THEME_STORAGE_KEY,JSON.stringify(themeStore));return true}catch(e){toast('Не удалось сохранить тему: память браузера заполнена','error');return false}}
function applyTheme(theme){if(!theme)return;const rootStyle=document.documentElement.style;['bg','panel','panel2','line','text','muted','accent'].forEach(k=>rootStyle.setProperty('--'+k,theme[k]||THEME_DEFAULT[k]));const bodyBg=theme.image?'linear-gradient(#0005,#0005),url("'+theme.image+'") center/cover fixed':'radial-gradient(ellipse at 50% -15%,'+theme.accent+'35 0,transparent 48%),var(--bg)';rootStyle.setProperty('--page-background',bodyBg);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',theme.bg||THEME_DEFAULT.bg)}
function activateTheme(name){const theme=allThemes().find(t=>t.name===name);if(!theme)return;themeStore.active=name;persistThemes();applyTheme(theme);render();toast('Тема «'+name+'» применена')}
function themeSettingsView(){const active=allThemes().find(t=>t.name===themeStore.active)||THEME_DEFAULT;return '<div class="card"><div class="eyebrow">Оформление Mini App</div><b style="display:block;margin:6px 0 10px">🎨 Мои темы</b><div class="tabs">'+allThemes().map(t=>'<button class="tab '+(t.name===active.name?'active':'')+'" onclick="activateTheme(\''+esc(t.name)+'\')">'+esc(t.name)+'</button>').join('')+'</div><div class="muted" style="margin:8px 0 12px">Выбери готовую тему или создай собственную. Настройки сохраняются на этом устройстве.</div><div class="grid2" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px"><label class="muted">Фон страницы<input id="themeBg" type="color" value="'+esc(active.bg)+'" style="display:block;width:100%;height:42px;margin-top:5px"></label><label class="muted">Акцентный цвет<input id="themeAccent" type="color" value="'+esc(active.accent)+'" style="display:block;width:100%;height:42px;margin-top:5px"></label><label class="muted">Цвет карточек<input id="themePanel" type="color" value="'+esc(active.panel)+'" style="display:block;width:100%;height:42px;margin-top:5px"></label><label class="muted">Цвет текста<input id="themeText" type="color" value="'+esc(active.text)+'" style="display:block;width:100%;height:42px;margin-top:5px"></label></div><label class="muted" style="display:block;margin-top:12px">Название новой темы<input id="themeName" class="search" maxlength="24" placeholder="Например, Моя тема"></label><label class="softbtn" style="display:flex;justify-content:center;align-items:center;min-height:44px;margin:8px 0;cursor:pointer">🖼 Добавить свой фон (необязательно)<input id="themeImage" type="file" accept="image/*" style="display:none" onchange="handleThemeBackground(this)"></label><div id="themeImageStatus" class="muted">'+(active.image?'Свой фон установлен':'Можно выбрать фото JPG, PNG или WebP')+'</div><div class="headrow" style="margin-top:12px;flex-wrap:wrap"><button class="softbtn" onclick="previewTheme()">Предпросмотр</button><button class="softbtn" onclick="saveCustomTheme()">＋ Сохранить тему</button></div><div class="headrow" style="margin-top:9px;flex-wrap:wrap"><button class="softbtn" onclick="shareActiveTheme()">🔗 Поделиться кодом</button><button class="softbtn" onclick="importThemeCode()">📥 Ввести код темы</button></div><div class="muted" style="margin-top:7px">Передай код другу — он сможет добавить такую же тему к себе.</div>'+(themeStore.custom.some(t=>t.name===active.name)?'<button class="softbtn" style="margin-top:9px;color:#ff9aa5" onclick="deleteCustomTheme(\''+esc(active.name)+'\')">Удалить эту тему</button>':'')+'</div>'}
window.handleThemeBackground=input=>{const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Выбери файл изображения','error');return}if(file.size>8*1024*1024){toast('Изображение должно быть до 8 МБ','error');input.value='';return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);themeDraftImage=canvas.toDataURL('image/jpeg',.72);const label=document.getElementById('themeImageStatus');if(label)label.textContent='Фон выбран и подготовлен'};img.onerror=()=>toast('Не удалось прочитать изображение','error');img.src=reader.result};reader.readAsDataURL(file)};
function collectTheme(){const get=id=>document.getElementById(id)?.value;return{name:String(get('themeName')||'').trim(),bg:get('themeBg')||THEME_DEFAULT.bg,panel:get('themePanel')||THEME_DEFAULT.panel,panel2:THEME_DEFAULT.panel2,line:THEME_DEFAULT.line,text:get('themeText')||THEME_DEFAULT.text,muted:THEME_DEFAULT.muted,accent:get('themeAccent')||THEME_DEFAULT.accent,image:themeDraftImage||''}}
window.previewTheme=()=>{const t=collectTheme();applyTheme(t);toast('Предпросмотр темы')};
window.saveCustomTheme=()=>{const t=collectTheme();if(!t.name){toast('Введи название темы','error');return}if(allThemes().some(x=>x.name.toLowerCase()===t.name.toLowerCase())){toast('Тема с таким названием уже существует','error');return}themeStore.custom.push(t);themeStore.active=t.name;if(!persistThemes()){themeStore.custom.pop();return}themeDraftImage='';applyTheme(t);render();toast('Тема «'+t.name+'» сохранена')};

function encodeThemeCode(theme){const payload={v:1,theme:{name:theme.name,bg:theme.bg,panel:theme.panel,panel2:theme.panel2,line:theme.line,text:theme.text,muted:theme.muted,accent:theme.accent,image:theme.image||''}};const bytes=new TextEncoder().encode(JSON.stringify(payload));let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return 'STHEME1-'+btoa(binary).split('+').join('-').split('/').join('_').replace(/=+$/,'')}
window.shareActiveTheme=async()=>{const theme=allThemes().find(t=>t.name===themeStore.active)||THEME_DEFAULT;const code=encodeThemeCode(theme);if(code.length>150000){toast('Код слишком большой. Попробуй убрать фон изображения','error');return}try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(code);toast('Код темы скопирован — отправь его другу')}else{const area=document.createElement('textarea');area.value=code;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const ok=document.execCommand('copy');area.remove();if(ok)toast('Код темы скопирован');else prompt('Скопируй код темы:',code)}}catch{prompt('Скопируй код темы:',code)}};
window.importThemeCode=()=>{const raw=prompt('Вставь код темы, который тебе прислали:');if(raw===null)return;const code=raw.trim();if(!code.startsWith('STHEME1-')||code.length>150000){toast('Неверный код темы','error');return}try{const base=code.slice(8).replace(/-/g,'+').replace(/_/g,'/');const binary=atob(base);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const data=JSON.parse(new TextDecoder().decode(bytes));const t=data?.theme;if(data?.v!==1||!t||typeof t!=='object')throw new Error('format');const hex=v=>typeof v==='string'&&/^#[0-9a-fA-F]{6}$/.test(v);for(const k of ['bg','panel','panel2','line','text','muted','accent'])if(!hex(t[k]))throw new Error('color');if(t.image&&(!['data:image/jpeg;base64,','data:image/png;base64,','data:image/webp;base64,'].some(prefix=>t.image.startsWith(prefix))||t.image.length>120000))throw new Error('image');let name=String(t.name||'Импортированная тема').replace(/[<>]/g,'').replaceAll(String.fromCharCode(10),'').replaceAll(String.fromCharCode(13),'').trim().slice(0,24)||'Импортированная тема';const baseName=name;let n=2;while(allThemes().some(x=>x.name.toLowerCase()===name.toLowerCase()))name=(baseName.slice(0,Math.max(1,20-String(n).length))+' '+n++).slice(0,24);const imported={name,bg:t.bg,panel:t.panel,panel2:t.panel2,line:t.line,text:t.text,muted:t.muted,accent:t.accent,image:t.image||''};themeStore.custom.push(imported);themeStore.active=name;if(!persistThemes()){themeStore.custom.pop();return}themeDraftImage='';applyTheme(imported);render();toast('Тема «'+name+'» добавлена')}catch(e){toast('Не удалось импортировать тему: проверь код','error')}};
window.deleteCustomTheme=name=>{if(!confirm('Удалить тему «'+name+'»?'))return;themeStore.custom=themeStore.custom.filter(t=>t.name!==name);if(themeStore.active===name)themeStore.active='Ночная';persistThemes();applyTheme(allThemes().find(t=>t.name===themeStore.active)||THEME_DEFAULT);render();toast('Тема удалена')};
applyTheme(allThemes().find(t=>t.name===themeStore.active)||THEME_DEFAULT);

function loadHomeworkMedia(){if(!tg?.initData)return;root.querySelectorAll('[data-homework-media-src]').forEach(node=>{const key=node.dataset.homeworkMediaKey,src=node.dataset.homeworkMediaSrc,apply=url=>{node.src=url;if(node.tagName==='IMG')node.closest('a')?.setAttribute('href',url)};if(homeworkMediaUrls[key]){apply(homeworkMediaUrls[key]);return}if(!homeworkMediaPending[key])homeworkMediaPending[key]=fetch(src,{headers:{'X-Telegram-Init-Data':tg.initData},cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()}).then(blob=>{const url=URL.createObjectURL(blob);homeworkMediaUrls[key]=url;return url}).catch(e=>{console.warn('[homework media]',e.message);return ''}).finally(()=>{delete homeworkMediaPending[key]});homeworkMediaPending[key].then(url=>{if(url&&node.isConnected)apply(url)})})}
function fileAsDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(new Error('Не удалось прочитать файл.'));reader.readAsDataURL(file)})}
async function uploadHomeworkFiles(files,target){if(target.length+files.length>10){toast('Можно прикрепить не более 10 файлов','error');return}homeworkMediaUploading=true;render();try{for(const file of files){if(!['image/jpeg','image/png','video/mp4'].includes(file.type)){toast('Формат '+file.name+' не поддерживается','error');continue}if(file.size>8*1024*1024){toast('Файл '+file.name+' больше 8 МБ','error');continue}const data=await fileAsDataUrl(file),result=await api('/api/homework-media-upload',{method:'POST',body:JSON.stringify({fileName:file.name,mimeType:file.type,data})});target.push(result.attachment);render()}toast('Вложения загружены')}catch(e){toast(e.message,'error')}finally{homeworkMediaUploading=false;render()}}

function downloadHtmlReport(filename,title,subtitle,headers,rows){const now=new Date().toLocaleString('ru-RU');const tableRows=rows.map(row=>'<tr>'+row.map(cell=>'<td>'+reportEscape(cell)+'</td>').join('')+'</tr>').join('');const html='<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+reportEscape(title)+'</title><style>body{font:15px Arial,sans-serif;max-width:1100px;margin:32px auto;padding:0 18px;color:#202938;background:#f5f7fb}h1{margin-bottom:8px}.muted{color:#667085}.wrap{overflow-x:auto;background:white;border:1px solid #e3e8f0;border-radius:12px;margin-top:22px}table{width:100%;border-collapse:collapse}th,td{padding:11px 13px;text-align:left;border-bottom:1px solid #e8edf3;vertical-align:top}th{background:#edf2fa;white-space:nowrap}tr:last-child td{border-bottom:0}@media print{body{background:white;margin:0}.wrap{border:0}}</style></head><body><h1>'+reportEscape(title)+'</h1><div>'+reportEscape(subtitle)+'</div><p class="muted">Сформировано: '+reportEscape(now)+'</p><div class="wrap"><table><thead><tr>'+headers.map(x=>'<th>'+reportEscape(x)+'</th>').join('')+'</tr></thead><tbody>'+tableRows+'</tbody></table></div></body></html>';const blob=new Blob([html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('HTML-отчёт подготовлен')}

window.saveProfile=async()=>{const field=document.getElementById('profileFullName');const fullName=String(field?.value||profileDraft||'').trim();if(!fullName){toast('Укажи ФИО','error');return}try{const result=await api('/api/profile',{method:'POST',body:JSON.stringify({fullName})});state.user.fullName=result.fullName;profileDraft=result.fullName;profileEditing=false;render();toast('Профиль обновлён');haptic('medium')}catch(e){toast(e.message,'error')}};
window.switchStudyGroup=async id=>{if(!id||String(id)===String(selectedGroupId))return;selectedGroupId=String(id);localStorage.setItem('starostaSelectedGroupIdV2',selectedGroupId);state=null;studentQuery='';studentAttendanceFilter='all';selectedKey='';root.innerHTML='<div class="loader"><div class="spinner"></div>Переключаем учебную группу…</div>';await load(true)};
window.setTab=tab=>{currentTab=tab;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();if(tab==='telegramChats')loadTelegramChats()};
window.setScheduleRange=value=>{scheduleRange=value;render();haptic('light')};
window.choose=encoded=>{try{selectedKey=decodeURIComponent(encoded)}catch{selectedKey=encoded}render()};
window.searchStudents=value=>{studentQuery=value;const pos=document.querySelector('.search')?.selectionStart;render();const el=document.querySelector('.search');if(el){el.focus();el.setSelectionRange(pos??value.length,pos??value.length)}};
window.setStudentAttendanceFilter=value=>{studentAttendanceFilter=['all','low','none'].includes(value)?value:'all';render();haptic('light')};
window.setAttendanceFilter=value=>{attendanceFilter=value;render()};
window.updateAnnouncementDraft=value=>{announcementDraft=String(value||'')};window.updateEventDraft=(key,value)=>{eventDraft[key]=String(value||'')};
window.createEvent=async()=>{
 const title=String(document.getElementById('eventTitle')?.value||'').trim();
 const date=String(document.getElementById('eventDate')?.value||'');
 const time=String(document.getElementById('eventTime')?.value||'');
 const type=String(document.getElementById('eventType')?.value||'other');
 const description=String(document.getElementById('eventDescription')?.value||'').trim();
 if(!title||!date){toast('Укажи название и дату события','error');return}
 try{
  const result=await api('/api/events',{method:'POST',body:JSON.stringify({title,date,time,type,description})});
  state.calendarEvents=state.calendarEvents||[];
  state.calendarEvents.push(result.event);
  state.calendarEvents.sort((a,b)=>(String(a.date).localeCompare(String(b.date))||String(a.time||'').localeCompare(String(b.time||''))));
  eventDraft={title:'',date:'',time:'',type:'exam',description:''};
  render();toast('Событие добавлено в календарь');haptic('medium');
 }catch(e){toast(e.message,'error')}
};
window.editEvent=async(id)=>{
 const event=(state.calendarEvents||[]).find(x=>String(x.id)===String(id));if(!event)return;
 const title=prompt('Название события',event.title||'');if(title===null)return;
 const date=prompt('Дата (ГГГГ-ММ-ДД)',event.date||'');if(date===null)return;
 const time=prompt('Время (ЧЧ:ММ, можно оставить пустым)',event.time||'');if(time===null)return;
 const description=prompt('Описание',event.description||'');if(description===null)return;
 try{const result=await api('/api/events',{method:'PUT',body:JSON.stringify({id,title,date,time,type:event.type||'other',description})});state.calendarEvents=(state.calendarEvents||[]).map(x=>String(x.id)===String(id)?result.event:x);render();toast('Событие обновлено')}catch(e){toast(e.message,'error')}
};
window.deleteEvent=async(id)=>{
 if(!id)return;
 try{await api('/api/events',{method:'DELETE',body:JSON.stringify({id})});state.calendarEvents=(state.calendarEvents||[]).filter(x=>String(x.id)!==String(id));render();toast('Событие удалено')}catch(e){toast(e.message,'error')}
};

window.publishAnnouncement=async()=>{const field=document.getElementById('announcementText');const textValue=String(field?.value||'').trim();if(!textValue){toast('Сначала напиши текст объявления','error');return}if(textValue.length>3000){toast('Максимум 3000 символов','error');return}if(window.__publishingAnnouncement)return;window.__publishingAnnouncement=true;try{const result=await api('/api/announcements',{method:'POST',body:JSON.stringify({text:textValue})});state.announcements=state.announcements||[];state.announcements.unshift(result.announcement);announcementDraft='';render();toast('Объявление отправлено в группу');haptic('medium')}catch(e){toast(e.message,'error')}finally{window.__publishingAnnouncement=false}};
window.mark=async(index,status)=>{if(saving)return;saving=true;haptic('light');try{await api('/api/attendance',{method:'POST',body:JSON.stringify({studentIndex:index,lessonKey:selectedKey,status})});const s=state.students.find(x=>x.index===index);if(s){s.statuses=s.statuses||{};s.statuses[selectedKey]=status;render();toast(status==='present'?'Отмечено присутствие':status==='absent'?'Отмечено отсутствие':'Отметка сброшена')}}catch(e){toast(e.message,'error')}finally{saving=false}};
window.load=async(silent=false)=>{
 if(document.activeElement&&(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable))return;
 if(loading||saving)return;
 loading=true;console.log('[miniapp] load started');
 // Сразу показываем последние сохранённые данные, пока идёт запрос к серверу.
 if(!state){const cached=readStateCache();if(cached&&(!selectedGroupId||String(cached.state.selectedGroupId||'')===String(selectedGroupId))){state=cached.state;cachedStateAt=cached.savedAt;showingCachedState=true;if(!selectedKey)selectedKey=state.lessons?.[0]?.key;render()}}
 if(!state)root.innerHTML='<div class="loader"><div class="spinner"></div>Загружаем кабинет…<div id="load-stage" style="margin-top:12px;font-size:12px">JavaScript запущен</div></div>';
 try{
  setDiagnostic('Инициализация Telegram…');
  if(!await waitForTelegram())throw new Error('Не удалось подключить Telegram WebApp. Открой кабинет через кнопку в боте.');
  if(!tg?.initData)throw new Error('Telegram WebApp подключён, но initData отсутствует.');
  const groupResult=await api('/api/groups');const available=groupResult.groups||[];
  if(!available.length)throw new Error('Для аккаунта не найдены назначенные группы.');
  if(!available.some(g=>String(g.id)===String(selectedGroupId))){selectedGroupId=String(available[0].id);localStorage.setItem('starostaSelectedGroupIdV2',selectedGroupId);}
  const fresh=await api('/api/data');
  fresh.availableGroups=available;fresh.selectedGroupId=selectedGroupId;
  state=fresh;cachedStateAt=Date.now();showingCachedState=false;saveStateCache(fresh);
  setDiagnostic('Данные кабинета получены');
  if(window.__scheduleRetryTimer)clearTimeout(window.__scheduleRetryTimer);
  if(state.scheduleLoading)window.__scheduleRetryTimer=setTimeout(()=>{if(document.visibilityState==='visible')load(true)},3500);
  if(!selectedKey||!(state.lessons||[]).some(x=>x.key===selectedKey))selectedKey=state.lessons?.[0]?.key;
  render();
  if(state.scheduleError)toast(state.scheduleError,'error');else if(!silent)toast('Данные обновлены');
 }catch(e){
  console.error('[miniapp] load failed at',window.__miniAppStage||'unknown',e?.message||e);
  if(state){showingCachedState=true;if(!cachedStateAt)cachedStateAt=Date.now();render();toast('Не удалось обновить данные: '+e.message,'error')}
  else showError(e.message)
 }finally{loading=false}
};
function showError(message){const sdk=Boolean(window.Telegram?.WebApp),hasData=Boolean(window.Telegram?.WebApp?.initData);root.innerHTML='<div class="error">⚠️ '+esc(message)+'</div><div class="card muted">Диагностика: Telegram SDK — '+(sdk?'подключён':'не найден')+'; данные авторизации — '+(hasData?'получены':'не получены')+'. Сами данные авторизации не отображаются.</div><p><button class="refresh" onclick="load()">Попробовать снова</button></p>'}
document.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
let lastAutoRefresh=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state&&Date.now()-lastAutoRefresh>15000){lastAutoRefresh=Date.now();load(true)}});
window.addEventListener('online',()=>{if(state)load(true)});
setInterval(()=>{const active=document.activeElement;const editing=active&&(/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)||active.isContentEditable);if(document.visibilityState==='visible'&&state&&!editing)load(true)},120000);
// Обновляем таймер до пары раз в минуту, не мешая вводу текста.
setInterval(()=>{const active=document.activeElement;const editing=active&&(/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)||active.isContentEditable);if(document.visibilityState==='visible'&&state&&currentTab==='home'&&!editing)render()},60000);
load();
</script></body></html>
