<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1220">
<title>Староста Бот — Кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0d1220;--panel:#171f31;--panel2:#202b42;--line:#2a3852;--text:#f4f7ff;--muted:#9ba9c1;--accent:#8da5ff;--green:#45d6a0;--red:#ff7788;--yellow:#ffd479}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#26365b 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:16px 15px calc(100px + env(safe-area-inset-bottom))}.wrap{max-width:720px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 22px}.brand{font-weight:850;font-size:19px;letter-spacing:-.4px}.brand span{display:inline-grid;place-items:center;width:35px;height:35px;background:#27365a;border-radius:12px;margin-right:8px}.badge{font-size:11px;color:#b9c7ff;background:#273354;padding:6px 10px;border-radius:30px;letter-spacing:.7px;font-weight:750}h1{font-size:27px;line-height:1.15;letter-spacing:-.8px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.refresh,.softbtn{border:1px solid var(--line);background:var(--panel2);color:#dce5ff;border-radius:12px;padding:9px 12px;font-weight:650}.hero{background:linear-gradient(135deg,#354b7e,#202c4c 70%);border:1px solid #50649a;border-radius:22px;padding:19px;margin:20px 0 16px;box-shadow:0 12px 35px #0003}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#c6d2ff;font-weight:800}.hero h2{font-size:21px;margin:8px 0 5px;line-height:1.25}.hero p{margin:0;color:#d1dcf8;font-size:13px}.hero-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:17px;padding-top:13px;border-top:1px solid #ffffff25;color:#e2e9ff;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800;margin:23px 2px 11px}.muted{color:var(--muted);font-weight:500;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px 12px;min-width:0}.stat .ico{font-size:16px}.stat b{display:block;font-size:24px;margin:5px 0 0;letter-spacing:-.6px}.stat span{font-size:11px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0}.lesson-list{display:grid;gap:9px}.lesson{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;color:var(--text);width:100%}.lesson.active{border-color:var(--accent);background:#202c49}.time{min-width:55px;color:#bdcaff;font-weight:800;font-size:13px}.lesson-info{min-width:0;flex:1}.lesson-info b{display:block;overflow-wrap:anywhere}.lesson-info small{display:block;color:var(--muted);margin-top:3px}.arrow{color:#91a5d5;font-size:20px}.student{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px 12px;margin:8px 0}.student-name{font-weight:650;min-width:0;overflow-wrap:anywhere}.student-meta{font-size:11px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:6px;flex-shrink:0}.actions button{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:8px 10px;font-size:14px}.actions .yes.on{background:#174b3b;border-color:var(--green)}.actions .no.on{background:#512832;border-color:var(--red)}.tabs{display:flex;gap:8px;overflow:auto;padding:3px 1px 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:12px;font-weight:650}.tab.active{background:#2a385c;border-color:#637dbd;color:#fff}.search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:13px 14px;border-radius:14px;font:inherit;outline:none;margin:4px 0 10px}.search:focus{border-color:var(--accent)}.progress{height:7px;background:#2a354b;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--green);border-radius:20px}.empty,.error,.loader{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:16px;color:var(--muted)}.error{color:#ffabb4}.loader{text-align:center;padding:55px 12px;border:0;background:transparent}.bottomnav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#111827ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.navinner{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navitem{border:0;background:transparent;color:#8f9db6;padding:7px 2px 5px;border-radius:12px;font:inherit;font-size:10px;font-weight:650}.navitem .ni{display:block;font-size:19px;margin-bottom:2px}.navitem.active{background:#263452;color:#dce5ff}.footer{text-align:center;color:var(--muted);font-size:11px;margin:23px 0 0}.hidden{display:none!important}.toast{position:fixed;z-index:20;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#263653;border:1px solid #52688f;color:#f4f7ff;padding:11px 16px;border-radius:13px;box-shadow:0 8px 30px #0006;max-width:calc(100vw - 30px);font-size:13px;font-weight:650;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#512832;border-color:#a94e5b;color:#ffe2e5}.spinner{width:25px;height:25px;border:3px solid #34415a;border-top-color:#9eb1ff;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}button{cursor:pointer;transition:filter .15s,transform .15s}button:active{transform:scale(.97);filter:brightness(1.15)}.lesson-info small{white-space:normal}@media(min-width:560px){.stats{gap:12px}.stat{padding:16px}.hero{padding:23px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><span>🎓</span>Староста Бот</div><div class="badge">MINI APP</div></header>
<div id="app"><div class="loader">Загружаем кабинет…</div></div>
</main>
<nav class="bottomnav"><div class="navinner">
<button class="navitem active" data-tab="home"><span class="ni">⌂</span>Главная</button>
<button class="navitem" data-tab="schedule"><span class="ni">▦</span>Расписание</button>
<button class="navitem" data-tab="attendance"><span class="ni">✓</span>Посещаемость</button>
<button class="navitem" data-tab="students"><span class="ni">♙</span>Студенты</button>
<button class="navitem" data-tab="profile"><span class="ni">☻</span>Профиль</button>
</div></nav>
<script>
let tg=null,state=null,selectedKey=null,loading=false,currentTab='home',studentQuery='';
const root=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initTelegram(){tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand();return true}return false}
async function waitForTelegram(){for(let i=0;i<30;i++){if(initTelegram())return true;await new Promise(r=>setTimeout(r,100))}return initTelegram()}
async function api(path,options={}){if(!tg?.initData)throw new Error('Telegram не передал данные авторизации. Закрой мини-приложение и открой его кнопкой «Открыть кабинет» в чате с ботом.');const headers={'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData,...(options.headers||{})};const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);let r;try{r=await fetch(path,{...options,headers,cache:'no-store',signal:controller.signal})}catch(e){if(e.name==='AbortError')throw new Error('Сервер не ответил за 30 секунд. Источник расписания может быть временно недоступен.');throw new Error('Не удалось связаться с сервером: '+(e.message||'сетевая ошибка'))}finally{clearTimeout(timer)}let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('Ошибка сервера ('+r.status+')'));return d}
function getLesson(){return (state?.lessons||[]).find(x=>x.key===selectedKey)||(state?.lessons||[])[0]||null}
function statusOf(s,key){return s.statuses?.[key]||'unmarked'}
function totals(key){const a=state.students||[];return{present:a.filter(s=>statusOf(s,key)==='present').length,absent:a.filter(s=>statusOf(s,key)==='absent').length,unmarked:a.filter(s=>statusOf(s,key)!=='present'&&statusOf(s,key)!=='absent').length,total:a.length}}
function lessonCards(){const lessons=state.lessons||[];return lessons.length?'<div class="lesson-list">'+lessons.map(x=>'<button class="lesson '+(x.key===selectedKey?'active':'')+'" onclick="choose(\''+encodeURIComponent(x.key)+'\')"><div class="time">'+esc(x.timeStart||'—')+'</div><div class="lesson-info"><b>'+esc(x.subject)+'</b><small>'+esc(x.room||'Аудитория не указана')+'</small></div><span class="arrow">›</span></button>').join('')+'</div>':'<div class="empty">На сегодня пар нет. Проверь выбранную группу в боте.</div>'}
function homeView(){const lessons=state.lessons||[],lesson=getLesson(),t=lesson?totals(lesson.key):totals('');const pct=t.total?Math.round(t.present/t.total*100):0;return '<div class="headrow"><div><h1>Привет, '+esc(state.user?.firstName||'староста')+'!</h1><div class="sub">'+esc(state.group)+' · '+esc(state.date)+'</div></div><button class="refresh" onclick="load()">↻ Обновить</button></div>'+
'<section class="hero"><div class="eyebrow">Твой учебный день · '+lessons.length+' пар</div><h2>'+(lesson?esc(lesson.subject):'Сегодня без пар')+'</h2><p>'+(lesson?esc(lesson.timeStart||'Время не указано')+' · '+esc(lesson.room||'Аудитория не указана'):'Когда появится расписание, оно отобразится здесь.')+'</p><div class="hero-bottom"><span>📚 '+(lesson?'Выбрана пара':'Расписание')+'</span><span>'+esc(state.group)+'</span></div></section>'+
'<div class="stats"><div class="stat"><span>👥 Студентов</span><b>'+(state.students||[]).length+'</b></div><div class="stat"><span>✅ Отмечено</span><b>'+(t.present+t.absent)+'</b></div><div class="stat"><span>📈 Присутствуют</span><b>'+pct+'%</b></div></div>'+
'<div class="section-title">Расписание на сегодня <button class="softbtn" onclick="setTab(\\'schedule\\')">Все пары →</button></div>'+lessonCards()+
(lesson?'<div class="section-title">Посещаемость выбранной пары</div><div class="card"><div class="headrow"><b>'+t.present+' из '+t.total+' присутствуют</b><span class="muted">'+pct+'%</span></div><div class="progress"><i style="width:'+pct+'%"></i></div><p class="muted">'+t.absent+' отсутствуют · '+t.unmarked+' не отмечены</p><button class="softbtn" onclick="setTab(\\'attendance\\')">Открыть посещаемость →</button></div>':'') }
function scheduleView(){return '<h1>Расписание</h1><div class="sub">'+esc(state.group)+' · '+esc(state.date)+'</div><div class="section-title">Пары на сегодня <span class="muted">'+(state.lessons||[]).length+' всего</span></div>'+lessonCards()}
function attendanceView(){const lesson=getLesson();if(!lesson)return '<h1>Посещаемость</h1><div class="empty">Нет пар для отметки. Когда расписание загрузится, здесь появится список занятий.</div>';const t=totals(lesson.key),pct=t.total?Math.round(t.present/t.total*100):0;return '<h1>Посещаемость</h1><div class="sub">Выбери занятие и отметь студентов</div><div class="section-title">Пары сегодня</div><div class="tabs">'+(state.lessons||[]).map(x=>'<button class="tab '+(x.key===selectedKey?'active':'')+'" onclick="choose(\\''+encodeURIComponent(x.key)+'\\')">'+esc(x.timeStart||'—')+' · '+esc(x.subject)+'</button>').join('')+'</div><div class="card"><div class="headrow"><b>'+esc(lesson.subject)+'</b><span class="muted">'+esc(lesson.timeStart||'')+'</span></div><div class="muted">'+esc(lesson.room||'Аудитория не указана')+'</div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="stats"><div class="stat"><span>Присутствуют</span><b>'+t.present+'</b></div><div class="stat"><span>Отсутствуют</span><b>'+t.absent+'</b></div><div class="stat"><span>Не отмечены</span><b>'+t.unmarked+'</b></div></div><div class="muted">'+pct+'% группы отмечено как присутствующие</div></div><div class="section-title">Список группы <span class="muted">'+t.total+' студентов</span></div><div class="tabs">'+[['all','Все'],['unmarked','Не отмечены'],['present','Присутствуют'],['absent','Отсутствуют']].map(([v,label])=>'<button class="tab '+(attendanceFilter===v?'active':'')+'" onclick="setAttendanceFilter(\\''+v+'\\')">'+label+'</button>').join('')+'</div>'+studentRows((state.students||[]).filter(s=>attendanceFilter==='all'||statusOf(s,lesson.key)===attendanceFilter),lesson.key)}
function studentRows(list,key){return list.length?list.map(s=>{const st=statusOf(s,key);return '<div class="student"><div style="min-width:0"><div class="student-name">'+esc(s.name)+'</div><div class="student-meta">'+(st==='present'?'Присутствует':st==='absent'?'Отсутствует':'Ожидает отметки')+'</div></div><div class="actions"><button aria-label="Отметить присутствие" class="yes '+(st==='present'?'on':'')+'" onclick="mark('+s.index+',\\'present\\')">✓</button><button aria-label="Отметить отсутствие" class="no '+(st==='absent'?'on':'')+'" onclick="mark('+s.index+',\\'absent\\')">✕</button>'+(st!=='unmarked'?'<button aria-label="Сбросить отметку" onclick="mark('+s.index+',\\'unmarked\\')">↶</button>':'')+'</div></div>'}).join(''):'<div class="empty">Список пуст или нет студентов в выбранной категории.</div>'}
function studentsView(){const all=state.students||[],q=studentQuery.trim().toLowerCase(),list=all.filter(s=>String(s.name||'').toLowerCase().includes(q)||String(s.username||'').toLowerCase().includes(q));return '<h1>Студенты</h1><div class="sub">'+esc(state.group)+' · '+all.length+' человек</div><input class="search" placeholder="Поиск по имени или username" value="'+esc(studentQuery)+'" oninput="searchStudents(this.value)"><div class="section-title">Список группы <span class="muted">'+list.length+' найдено</span></div>'+(list.length?list.map(s=>'<div class="student"><div style="min-width:0"><div class="student-name">'+esc(s.name)+'</div><div class="student-meta">'+(s.username?'@'+esc(s.username):'Username не указан')+'</div></div><span class="muted">#'+esc(s.index)+'</span></div>').join(''):'<div class="empty">Ничего не найдено.</div>')}
function profileView(){return '<h1>Профиль</h1><div class="sub">Информация о кабинете</div><div class="card"><div class="eyebrow">Пользователь</div><h2 style="margin:7px 0">'+esc(state.user?.firstName||'Пользователь')+'</h2><div class="muted">'+(state.user?.username?'@'+esc(state.user.username):'Telegram username не указан')+'</div></div><div class="card"><div class="eyebrow">Учебная группа</div><h2 style="margin:7px 0">'+esc(state.group)+'</h2><div class="muted">Дата данных: '+esc(state.date)+'</div></div><div class="card"><div class="eyebrow">Данные кабинета</div><p>Студенты: <b>'+(state.students||[]).length+'</b></p><p>Пар сегодня: <b>'+(state.lessons||[]).length+'</b></p><button class="softbtn" onclick="load()">↻ Обновить данные</button></div><div class="footer">Староста Бот · изменения посещаемости сохраняются в общей базе бота.</div>'}
function render(){if(!state)return;const views={home:homeView,schedule:scheduleView,attendance:attendanceView,students:studentsView,profile:profileView};root.innerHTML=views[currentTab]();document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}
window.setTab=tab=>{currentTab=tab;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()};
window.choose=encoded=>{try{selectedKey=decodeURIComponent(encoded)}catch{selectedKey=encoded}render()};
window.searchStudents=value=>{studentQuery=value;const pos=document.querySelector('.search')?.selectionStart;render();const el=document.querySelector('.search');if(el){el.focus();el.setSelectionRange(pos??value.length,pos??value.length)}};
window.setAttendanceFilter=value=>{attendanceFilter=value;render()};
window.mark=async(index,status)=>{if(loading)return;loading=true;try{await api('/api/attendance',{method:'POST',body:JSON.stringify({studentIndex:index,lessonKey:selectedKey,status})});const s=state.students.find(x=>x.index===index);if(s){s.statuses=s.statuses||{};s.statuses[selectedKey]=status;render()}}catch(e){showError(e.message)}finally{loading=false}};
window.load=async()=>{if(loading)return;root.innerHTML='<div class="loader">Загружаем кабинет…</div>';try{if(!await waitForTelegram())throw new Error('Не удалось подключить Telegram WebApp. Открой кабинет через кнопку в боте.');state=await api('/api/data');selectedKey=selectedKey||state.lessons?.[0]?.key;render()}catch(e){showError(e.message)}};
function showError(message){const sdk=Boolean(window.Telegram?.WebApp),hasData=Boolean(window.Telegram?.WebApp?.initData);root.innerHTML='<div class="error">⚠️ '+esc(message)+'</div><div class="card muted">Диагностика: Telegram SDK — '+(sdk?'подключён':'не найден')+'; данные авторизации — '+(hasData?'получены':'не получены')+'. Сами данные авторизации не отображаются.</div><p><button class="refresh" onclick="load()">Попробовать снова</button></p>'}
document.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!state)load()});
load();
</script></body></html>
