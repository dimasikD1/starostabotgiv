/* Полировка интерфейса: доступность, статус пары и офлайн-режим */

<script>
(function(){
  var app=document.getElementById('app');
  function show(message){if(app){var box=document.getElementById('early-diagnostic');if(!box){box=document.createElement('div');box.id='early-diagnostic';box.style.cssText='margin-top:12px;padding:10px;border:1px solid #52658e;border-radius:10px;color:#dce5ff;font-size:13px;white-space:pre-wrap';app.appendChild(box)}box.textContent=message}}
  function reportClientError(payload){
    try{
      var body=JSON.stringify(payload);
      if(navigator.sendBeacon){
        var sent=navigator.sendBeacon('/__client-error',new Blob([body],{type:'application/json'}));
        if(sent)return;
      }
      fetch('/__client-error',{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:true,credentials:'same-origin'}).catch(function(){});
    }catch(reportError){console.error('[miniapp diagnostic transport]',reportError)}
  }
  window.addEventListener('error',function(e){
    var message=e.message||'Неизвестная ошибка JavaScript';
    show('Ошибка JavaScript: '+message+(e.lineno?' (строка '+e.lineno+')':''));
    console.error('[miniapp early error]',message,e.filename,e.lineno,e.colno);
    reportClientError({kind:e.target&&e.target!==window?'resource-error':'javascript-error',message:message,source:e.filename||(e.target&&(e.target.src||e.target.href))||'',line:e.lineno||0,column:e.colno||0,stage:window.__miniAppStage||'before-main-script',stack:e.error&&e.error.stack||''});
  },true);
  window.addEventListener('unhandledrejection',function(e){
    var reason=e.reason, message=String(reason&&reason.message||reason||'Неизвестная ошибка Promise');
    show('Ошибка выполнения: '+message);
    console.error('[miniapp early rejection]',reason);
    reportClientError({kind:'unhandled-rejection',message:message,stage:window.__miniAppStage||'unknown',stack:reason&&reason.stack||''});
  });
  setTimeout(function(){if(!window.__miniAppStage)show('Основной скрипт не запустился. Проверьте подключение Telegram SDK и ошибки JavaScript.')},1500);
  var sdk=document.querySelector('script[src*="telegram-web-app.js"]');
  if(sdk)sdk.addEventListener('error',function(){show('Не удалось загрузить Telegram WebApp SDK')});
})();
</script>
<script>
console.log('[miniapp] JavaScript started');
let tg=null,state=null,selectedKey=null,loading=false,saving=false,currentTab='home',studentQuery='',attendanceFilter='all',studentAttendanceFilter='all',announcementDraft='',telegramChats=[],selectedTelegramChatId='',chatAnnouncementDraft='';let homeworkMediaDraft=[],homeworkMediaUploading=false,homeworkMediaUrls={},homeworkMediaPending={},homeworkMediaEditingId=null,homeworkMediaEditDraft=[];let homeworkSubjectFilter='all';
let profileEditing=false,profileDraft='';
let scheduleRange='today';
const root=document.getElementById('app');
function toast(message,type='ok'){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}el.textContent=message;el.className='toast show '+type;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function haptic(kind='light'){try{tg?.HapticFeedback?.impactOccurred(kind)}catch{}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initTelegram(){tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand();return true}return false}
function setDiagnostic(stage){window.__miniAppStage=stage;console.log('[miniapp stage]',stage);const el=document.getElementById('load-stage');if(el)el.textContent=stage}
async function waitForTelegram(){
 setDiagnostic('Подключаем Telegram WebApp…');
 const started=Date.now();let nextRetry=0,retries=0;
 while(Date.now()-started<20000){
  if(initTelegram()){
   setDiagnostic(tg?.initData?'Telegram подключён, авторизация получена':'Telegram подключён, initData отсутствует');
   return true;
  }
  if(Date.now()>=nextRetry&&retries<4){
   const script=document.createElement('script');
   script.src='/telegram-web-app.js?retry='+retries;
   script.async=true;

function newsView(){const items=state.announcements||[];return '<h1>Объявления</h1><div class="sub">Сообщения для участников учебной группы</div><div class="card"><b>📢 Новое объявление</b><textarea id="announcementText" class="search announce-input" maxlength="3000" placeholder="Напиши важную информацию для группы…" rows="5" oninput="updateAnnouncementDraft(this.value)">'+esc(announcementDraft)+'</textarea><div class="headrow"><span class="muted">До 3000 символов</span><button class="softbtn" onclick="publishAnnouncement()">Отправить в группу ↗</button></div></div><div class="section-title">История объявлений <span class="muted">'+items.length+'</span></div>'+(items.length?items.map(x=>'<article class="card"><div class="headrow"><b>📢 Объявление</b><span class="muted">'+esc(new Date(x.createdAt).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}))+'</span></div><div class="announcement-text">'+esc(x.text)+'</div><div class="muted" style="margin-top:10px">Автор: '+esc(x.authorName||'Староста')+'</div></article>').join(''):'<div class="empty">Пока объявлений нет. Создай первое сообщение для группы.</div>')}
function profileView(){const fullName=state.user?.fullName||'';return '<h1>Профиль</h1><div class="sub">Личные данные и настройки кабинета</div>'+(state.user?.canManageTelegramChats?'<button class="card action" onclick="setTab(\'telegramChats\')"><div class="bigicon">💬</div><b>Telegram-чаты</b><div class="muted">Права участников и объявления</div></button>':'')+'</div>'}
function telegramChatsView(){if(!state.user?.canManageTelegramChats)return '<h1>💬 Telegram-чаты</h1><div class="empty">Нет прав для управления Telegram-чатами.</div>';if(!telegramChats.length)return '<h1>💬 Telegram-чаты</h1><div class="sub">Подключённые учебные чаты</div><div class="empty">Нет доступных подключённых чатов. Если чат уже зарегистрирован, обнови список.</div><button class="softbtn" onclick="loadTelegramChats()">↻ Обновить список</button>';const chosen=telegramChats.find(x=>String(x.id)===String(selectedTelegramChatId))||telegramChats[0];selectedTelegramChatId=String(chosen.id);return '<h1>💬 Telegram-чаты</h1><div class="sub">Управление правами участников и публикациями</div><div class="card"><label class="muted" for="telegramChatSelect">Выбери чат</label><select id="telegramChatSelect" class="search" onchange="selectTelegramChat(this.value)">'+telegramChats.map(x=>'<option value="'+esc(x.id)+'" '+(String(x.id)===selectedTelegramChatId?'selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select><div class="muted">ID чата: '+esc(chosen.id)+'</div><button class="refresh" style="width:100%;margin-top:12px" onclick="openTelegramChat()">🔓 Разрешить студентам писать</button><div class="muted" style="margin-top:8px">Разрешит отправку сообщений всем участникам чата. Персональные ограничения (муты) не снимаются.</div></div><div class="card"><b>📢 Опубликовать объявление</b><textarea id="chatAnnouncementText" class="search announce-input" maxlength="3000" rows="5" placeholder="Текст объявления для выбранного чата…" oninput="chatAnnouncementDraft=this.value">'+esc(chatAnnouncementDraft)+'</textarea><div class="headrow"><span class="muted">До 3000 символов</span><button class="softbtn" onclick="publishChatAnnouncement()">Опубликовать ↗</button></div></div><button class="softbtn" onclick="loadTelegramChats()">↻ Обновить список чатов</button><button class="softbtn" onclick="setTab(\'more\')">← Назад</button>'}
window.loadTelegramChats=async()=>{try{const result=await api('/api/telegram-chats');telegramChats=result.chats||[];if(!telegramChats.some(x=>String(x.id)===String(selectedTelegramChatId)))selectedTelegramChatId=String(telegramChats[0]?.id||'');render()}catch(e){toast(e.message,'error')}};
window.selectTelegramChat=id=>{selectedTelegramChatId=String(id||'');chatAnnouncementDraft='';render()};
window.openTelegramChat=async()=>{if(!selectedTelegramChatId)return toast('Сначала выбери чат','error');try{const result=await api('/api/telegram-chats',{method:'POST',body:JSON.stringify({chatId:selectedTelegramChatId,action:'open'})});toast(result.message||'Настройки чата обновлены');haptic('medium')}catch(e){toast(e.message,'error')}};
window.publishChatAnnouncement=async()=>{const field=document.getElementById('chatAnnouncementText');const textValue=String(field?.value||chatAnnouncementDraft||'').trim();if(!selectedTelegramChatId)return toast('Сначала выбери чат','error');if(!textValue)return toast('Напиши текст объявления','error');if(textValue.length>3000)return toast('Максимум 3000 символов','error');try{const result=await api('/api/telegram-chats',{method:'POST',body:JSON.stringify({chatId:selectedTelegramChatId,action:'announce',text:textValue})});chatAnnouncementDraft='';render();toast(result.message||'Объявление опубликовано');haptic('medium')}catch(e){toast(e.message,'error')}};
function render(){if(!state)return;const views={home:homeView,study:studyHubView,more:moreHubView,telegramChats:telegramChatsView,homework:homeworkView,schedule:scheduleView,attendance:attendanceView,students:studentsView,news:newsView,profile:profileView,themes:()=>'<h1>🎨 Темы оформления</h1><div class="sub">Настрой внешний вид своего Mini App</div><button class="softbtn" onclick="setTab(\'profile\')" style="margin:12px 0">← Назад в профиль</button>'+themeSettingsView()};root.innerHTML=(showingCachedState?'<div class="offline-banner" role="status">Показаны сохранённые данные'+(cachedStateAt?' от '+esc(new Date(cachedStateAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})):'')+'. Свежие данные загрузятся автоматически.</div>':'')+(state.availableGroups&&state.availableGroups.length>1?'<div class="card" style="margin:0 0 14px;padding:12px"><label for="groupSwitcher" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Учебная группа</label><select id="groupSwitcher" class="search" style="margin:0" onchange="switchStudyGroup(this.value)">'+state.availableGroups.map(g=>'<option value="'+esc(g.id)+'" '+(String(g.id)===String(selectedGroupId)?'selected':'')+'>'+esc(g.title)+'</option>').join('')+'</select></div>':'')+views[currentTab]();document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));loadHomeworkMedia()}
window.toggleProfileEdit=()=>{profileEditing=!profileEditing;profileDraft=state.user?.fullName||'';render()};
window.saveProfile=async()=>{const field=document.getElementById('profileFullName');const fullName=String(field?.value||profileDraft||'').trim();if(!fullName){toast('Укажи ФИО','error');return}try{const result=await api('/api/profile',{method:'POST',body:JSON.stringify({fullName})});state.user.fullName=result.fullName;profileDraft=result.fullName;profileEditing=false;render();toast('Профиль обновлён');haptic('medium')}catch(e){toast(e.message,'error')}};
window.switchStudyGroup=async id=>{if(!id||String(id)===String(selectedGroupId))return;selectedGroupId=String(id);localStorage.setItem('starostaSelectedGroupIdV2',selectedGroupId);state=null;studentQuery='';studentAttendanceFilter='all';selectedKey='';root.innerHTML='<div class="loader"><div class="spinner"></div>Переключаем учебную группу…</div>';await load(true)};
window.setTab=tab=>{currentTab=tab;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();if(tab==='telegramChats')loadTelegramChats()};
window.setScheduleRange=value=>{scheduleRange=value;render();haptic('light')};
window.choose=encoded=>{try{selectedKey=decodeURIComponent(encoded)}catch{selectedKey=encoded}render()};
window.searchStudents=value=>{studentQuery=value;const pos=document.querySelector('.search')?.selectionStart;render();const el=document.querySelector('.search');if(el){el.focus();el.setSelectionRange(pos??value.length,pos??value.length)}};
window.setStudentAttendanceFilter=value=>{studentAttendanceFilter=['all','low','none'].includes(value)?value:'all';render();haptic('light')};
window.setAttendanceFilter=value=>{attendanceFilter=value;render()};
window.updateAnnouncementDraft=value=>{announcementDraft=String(value||'')};


window.publishAnnouncement=async()=>{const field=document.getElementById('announcementText');const textValue=String(field?.value||'').trim();if(!textValue){toast('Сначала напиши текст объявления','error');return}if(textValue.length>3000){toast('Максимум 3000 символов','error');return}if(window.__publishingAnnouncement)return;window.__publishingAnnouncement=true;try{const result=await api('/api/announcements',{method:'POST',body:JSON.stringify({text:textValue})});state.announcements=state.announcements||[];state.announcements.unshift(result.announcement);announcementDraft='';render();toast('Объявление отправлено в группу');haptic('medium')}catch(e){toast(e.message,'error')}finally{window.__publishingAnnouncement=false}};
window.mark=async(index,status)=>{if(saving)return;saving=true;haptic('light');try{await api('/api/attendance',{method:'POST',body:JSON.stringify({studentIndex:index,lessonKey:selectedKey,status})});const s=state.students.find(x=>x.index===index);if(s){s.statuses=s.statuses||{};s.statuses[selectedKey]=status;render();toast(status==='present'?'Отмечено присутствие':status==='absent'?'Отмечено отсутствие':'Отметка сброшена')}}catch(e){toast(e.message,'error')}finally{saving=false}};
window.load=async(silent=false)=>{
 if(document.activeElement&&(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)||document.activeElement.isContentEditable))return;
 if(loading||saving)return;
 loading=true;console.log('[miniapp] load started');
 // Сразу показываем последние сохранённые данные, пока идёт запрос к серверу.
 if(!state){const cached=readStateCache();if(cached&&(!selectedGroupId||String(cached.state.selectedGroupId||'')===String(selectedGroupId))){state=cached.state;cachedStateAt=cached.savedAt;showingCachedState=true;if(!selectedKey)selectedKey=state.lessons?.[0]?.key;render()}}
 if(!state)root.innerHTML='<div class="loader"><div class="spinner"></div>Загружаем кабинет…<div id="load-stage" style="margin-top:12px;font-size:12px">JavaScript запущен</div></div>';
 try{
  setDiagnostic('Инициализация Telegram…');
  if(!await waitForTelegram())throw new Error('Не удалось подключить Telegram WebApp. Открой кабинет через кнопку в боте.');
  if(!tg?.initData)throw new Error('Telegram WebApp подключён, но initData отсутствует.');
  const groupResult=await api('/api/groups');const available=groupResult.groups||[];
  if(!available.length)throw new Error('Для аккаунта не найдены назначенные группы.');
  if(!available.some(g=>String(g.id)===String(selectedGroupId))){selectedGroupId=String(available[0].id);localStorage.setItem('starostaSelectedGroupIdV2',selectedGroupId);}
  const fresh=await api('/api/data');
  fresh.availableGroups=available;fresh.selectedGroupId=selectedGroupId;
  state=fresh;cachedStateAt=Date.now();showingCachedState=false;saveStateCache(fresh);
  setDiagnostic('Данные кабинета получены');
  if(window.__scheduleRetryTimer)clearTimeout(window.__scheduleRetryTimer);
  if(state.scheduleLoading)window.__scheduleRetryTimer=setTimeout(()=>{if(document.visibilityState==='visible')load(true)},3500);
  if(!selectedKey||!(state.lessons||[]).some(x=>x.key===selectedKey))selectedKey=state.lessons?.[0]?.key;
  render();
  if(state.scheduleError)toast(state.scheduleError,'error');else if(!silent)toast('Данные обновлены');
 }catch(e){
  console.error('[miniapp] load failed at',window.__miniAppStage||'unknown',e?.message||e);
  if(state){showingCachedState=true;if(!cachedStateAt)cachedStateAt=Date.now();render();toast('Не удалось обновить данные: '+e.message,'error')}
  else showError(e.message)
 }finally{loading=false}
};
function showError(message){const sdk=Boolean(window.Telegram?.WebApp),hasData=Boolean(window.Telegram?.WebApp?.initData);root.innerHTML='<div class="error">⚠️ '+esc(message)+'</div><div class="card muted">Диагностика: Telegram SDK — '+(sdk?'подключён':'не найден')+'; данные авторизации — '+(hasData?'получены':'не получены')+'. Сами данные авторизации не отображаются.</div><p><button class="refresh" onclick="load()">Попробовать снова</button></p>'}
document.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
let lastAutoRefresh=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state&&Date.now()-lastAutoRefresh>15000){lastAutoRefresh=Date.now();load(true)}});
window.addEventListener('online',()=>{if(state)load(true)});
setInterval(()=>{const active=document.activeElement;const editing=active&&(/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)||active.isContentEditable);if(document.visibilityState==='visible'&&state&&!editing)load(true)},120000);
// Обновляем таймер до пары раз в минуту, не мешая вводу текста.
setInterval(()=>{const active=document.activeElement;const editing=active&&(/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)||active.isContentEditable);if(document.visibilityState==='visible'&&state&&currentTab==='home'&&!editing)render()},60000);
load();
</script></body></html>
