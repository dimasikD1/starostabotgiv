<style>
:root{color-scheme:dark;--bg:#0d1220;--panel:#171f31;--panel2:#202b42;--line:#2a3852;--text:#f4f7ff;--muted:#9ba9c1;--accent:#8da5ff;--green:#45d6a0;--red:#ff7788;--yellow:#ffd479}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#26365b 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,sans-serif;padding:16px 15px calc(100px + env(safe-area-inset-bottom))}.wrap{max-width:720px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 22px}.brand{font-weight:850;font-size:19px;letter-spacing:-.4px}.brand span{display:inline-grid;place-items:center;width:35px;height:35px;background:#27365a;border-radius:12px;margin-right:8px}.badge{font-size:11px;color:#b9c7ff;background:#273354;padding:6px 10px;border-radius:30px;letter-spacing:.7px;font-weight:750}h1{font-size:27px;line-height:1.15;letter-spacing:-.8px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.refresh,.softbtn{border:1px solid var(--line);background:var(--panel2);color:#dce5ff;border-radius:12px;padding:9px 12px;font-weight:650}.hero{background:linear-gradient(135deg,#354b7e,#202c4c 70%);border:1px solid #50649a;border-radius:22px;padding:19px;margin:20px 0 16px;box-shadow:0 12px 35px #0003}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#c6d2ff;font-weight:800}.hero h2{font-size:21px;margin:8px 0 5px;line-height:1.25}.hero p{margin:0;color:#d1dcf8;font-size:13px}.hero-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:17px;padding-top:13px;border-top:1px solid #ffffff25;color:#e2e9ff;font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800;margin:23px 2px 11px}.muted{color:var(--muted);font-weight:500;font-size:12px}.quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.quick-action{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;text-align:left;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--text)}.quick-action>span{font-size:19px}.quick-action b{font-size:13px}.quick-action small{font-size:11px;color:var(--muted)}.home-announcement{margin:8px 0}.home-announcement .announcement-text{margin-top:6px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px 12px;min-width:0}.stat .ico{font-size:16px}.stat b{display:block;font-size:24px;margin:5px 0 0;letter-spacing:-.6px}.stat span{font-size:11px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin:9px 0}.lesson-list{display:grid;gap:9px}.lesson{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;color:var(--text);width:100%}.lesson.active{border-color:var(--accent);background:#202c49}.time{min-width:55px;color:#bdcaff;font-weight:800;font-size:13px}.lesson-info{min-width:0;flex:1}.lesson-info b{display:block;overflow-wrap:anywhere}.lesson-info small{display:block;color:var(--muted);margin-top:3px}.arrow{color:#91a5d5;font-size:20px}.student{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px 12px;margin:8px 0}.student-name{font-weight:650;min-width:0;overflow-wrap:anywhere}.student-meta{font-size:11px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:6px;flex-shrink:0}.actions button{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:8px 10px;font-size:14px}.actions .yes.on{background:#174b3b;border-color:var(--green)}.actions .no.on{background:#512832;border-color:var(--red)}.tabs{display:flex;gap:8px;overflow:auto;padding:3px 1px 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:12px;font-weight:650}.tab.active{background:#2a385c;border-color:#637dbd;color:#fff}.search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:13px 14px;border-radius:14px;font:inherit;outline:none;margin:4px 0 10px}.search:focus{border-color:var(--accent)}.announce-input{display:block;resize:vertical;min-height:120px;line-height:1.5}.announcement-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px;line-height:1.55}.progress{height:7px;background:#2a354b;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--green);border-radius:20px}.empty,.error,.loader{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:16px;color:var(--muted)}.error{color:#ffabb4}.loader{text-align:center;padding:55px 12px;border:0;background:transparent}.bottomnav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#111827ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}.navinner{width:100%;max-width:720px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.navitem{border:0;background:transparent;color:#8f9db6;padding:7px 2px 5px;border-radius:12px;font:inherit;font-size:10px;font-weight:650}.navitem .ni{display:block;font-size:19px;margin-bottom:2px}.navitem.active{background:#263452;color:#dce5ff}.footer{text-align:center;color:var(--muted);font-size:11px;margin:23px 0 0}.hidden{display:none!important}.toast{position:fixed;z-index:20;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#263653;border:1px solid #52688f;color:#f4f7ff;padding:11px 16px;border-radius:13px;box-shadow:0 8px 30px #0006;max-width:calc(100vw - 30px);font-size:13px;font-weight:650;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#512832;border-color:#a94e5b;color:#ffe2e5}.spinner{width:25px;height:25px;border:3px solid #34415a;border-top-color:#9eb1ff;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}button{cursor:pointer;transition:filter .15s,transform .15s}button:active{transform:scale(.97);filter:brightness(1.15)}.lesson-info small{white-space:normal}@media(min-width:560px){.stats{gap:12px}.stat{padding:16px}.hero{padding:23px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="brand"><span>🎓</span>Староста Бот</div><div class="badge">MINI APP</div></header>
<div id="app"><div class="loader">Загружаем кабинет…</div></div>
</main>
<nav class="bottomnav"><div class="navinner">
<button class="navitem active" data-tab="home"><span class="ni">⌂</span>Главная</button>
<button class="navitem" data-tab="schedule"><span class="ni">▦</span>Расписание</button>
<button class="navitem" data-tab="attendance"><span class="ni">✓</span>Посещаемость</button>
<button class="navitem" data-tab="students"><span class="ni">♙</span>Студенты</button>

</div></nav>
<script>
(function(){
  var app=document.getElementById('app');
  function show(message){if(app){var box=document.getElementById('early-diagnostic');if(!box){box=document.createElement('div');box.id='early-diagnostic';box.style.cssText='margin-top:12px;padding:10px;border:1px solid #52658e;border-radius:10px;color:#dce5ff;font-size:13px;white-space:pre-wrap';app.appendChild(box)}box.textContent=message}}
  window.addEventListener('error',function(e){show('Ошибка JavaScript: '+(e.message||'неизвестная ошибка')+(e.lineno?' (строка '+e.lineno+')':''));console.error('[miniapp early error]',e.message,e.filename,e.lineno)});
  window.addEventListener('unhandledrejection',function(e){show('Ошибка выполнения: '+String(e.reason&&e.reason.message||e.reason));console.error('[miniapp early rejection]',e.reason)});
  setTimeout(function(){if(!window.__miniAppStage)show('Основной скрипт не запустился. Проверьте подключение Telegram SDK и ошибки JavaScript.')},1500);
  var sdk=document.querySelector('script[src*="telegram-web-app.js"]');
  if(sdk)sdk.addEventListener('error',function(){show('Не удалось загрузить Telegram WebApp SDK')});
})();
</script>
<script>
console.log('[miniapp] JavaScript started');
let tg=null,state=null,selectedKey=null,loading=false,saving=false,currentTab='home',studentQuery='',attendanceFilter='all';
let scheduleRange='today';
const root=document.getElementById('app');
function toast(message,type='ok'){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el)}el.textContent=message;el.className='toast show '+type;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function haptic(kind='light'){try{tg?.HapticFeedback?.impactOccurred(kind)}catch{}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function initTelegram(){tg=window.Telegram?.WebApp||null;if(tg){tg.ready();tg.expand();return true}return false}
function setDiagnostic(stage){window.__miniAppStage=stage;console.log('[miniapp]',stage);const el=document.getElementById('load-stage');if(el)el.textContent=stage}
async function waitForTelegram(){setDiagnostic('Подключаем Telegram WebApp…');for(let i=0;i<30;i++){if(initTelegram()){setDiagnostic(tg?.initData?'Telegram подключён, авторизация получена':'Telegram подключён, initData отсутствует');return true}await new Promise(r=>setTimeout(r,100))}setDiagnostic('Telegram SDK не найден');return initTelegram()}
async function api(path,options={}){if(!tg?.initData)throw new Error('Telegram не передал данные авторизации. Закрой мини-приложение и открой его кнопкой «Открыть кабинет» в чате с ботом.');const method=options.method||'GET',started=Date.now();setDiagnostic('Отправляем запрос '+method+' '+path+'…');console.log('[miniapp] request start',method,path);const headers={'Content-Type':'application/json','X-Telegram-Init-Data':tg.initData,...(options.headers||{})};const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);let r;try{r=await fetch(path,{...options,headers,cache:'no-store',signal:controller.signal});console.log('[miniapp] response',method,path,r.status,Date.now()-started+'ms');setDiagnostic('Ответ сервера: '+r.status+' ('+(Date.now()-started)+' мс)')}catch(e){console.error('[miniapp] request failed',method,path,e?.message||e);setDiagnostic('Ошибка запроса: '+(e?.name||'network'));if(e.name==='AbortError')throw new Error('Сервер не ответил за 30 секунд. Источник расписания может быть временно недоступен.');throw new Error('Не удалось связаться с сервером: '+(e.message||'сетевая ошибка'))}finally{clearTimeout(timer)}let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('Ошибка сервера ('+r.status+')'));return d}
function getLesson(){return (state?.lessons||[]).find(x=>x.key===selectedKey)||(state?.lessons||[])[0]||null}
function statusOf(s,key){return s.statuses?.[key]||'unmarked'}
function totals(key){const a=state.students||[];return{present:a.filter(s=>statusOf(s,key)==='present').length,absent:a.filter(s=>statusOf(s,key)==='absent').length,unmarked:a.filter(s=>statusOf(s,key)!=='present'&&statusOf(s,key)!=='absent').length,total:a.length}}
function lessonCards(){const lessons=state.lessons||[];return lessons.length?'<div class="lesson-list">'+lessons.map(x=>'<button class="lesson '+(x.key===selectedKey?'active':'')+'" onclick="choose(\''+encodeURIComponent(x.key)+'\')"><div class="time">'+esc(x.timeStart||'—')+'</div><div class="lesson-info"><b>'+esc(x.subject)+'</b><small>'+esc(x.room||'Аудитория не указана')+'</small></div><span class="arrow">›</span></button>').join('')+'</div>':'<div class="empty">На сегодня пар нет. Проверь выбранную группу в боте.</div>'}
function minutesFromTime(value){const m=String(value||'').match(/^(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}
function lessonDayState(){const now=new Date(),today=state.date,nowMinutes=now.getHours()*60+now.getMinutes();const all=(state.scheduleLessons||state.lessons||[]).filter(x=>x.date===today&&x.subject).sort((a,b)=>String(a.timeStart||'').localeCompare(String(b.timeStart||'')));for(let i=0;i<all.length;i++){const item=all[i],from=minutesFromTime(item.timeStart),to=minutesFromTime(item.timeEnd);if(from!==null&&to!==null&&nowMinutes>=from&&nowMinutes<to)return{kind:'current',lesson:item,minutes:to-nowMinutes,next:all[i+1]||null};if(from!==null&&nowMinutes<from)return{kind:'next',lesson:item,minutes:from-nowMinutes}}return{kind:'finished',lesson:null,minutes:0}}
function durationLabel(minutes){if(minutes<=0)return 'сейчас';const h=Math.floor(minutes/60),m=minutes%60;return h?(m?h+' ч '+m+' мин':h+' ч'):m+' мин'}
function homeView(){const lessons=state.lessons||[],timing=lessonDayState(),focus=timing.lesson,lesson=focus||getLesson(),t=lesson?totals(lesson.key):totals(''),pct=t.total?Math.round(t.present/t.total*100):0;const timingLabel=timing.kind==='current'?'Сейчас идёт пара':timing.kind==='next'?'Следующая пара': 'Учебный день';const focusTitle=focus?focus.subject:(timing.kind==='finished'?'На сегодня пары закончились':'Сегодня без пар');const focusMeta=focus?[focus.timeStart||'Время не указано',focus.room||'Аудитория не указана'].join(' · '):'Расписание на сегодня появится здесь после загрузки';const recent=(state.announcements||[]).slice(0,2);return '<div class="headrow"><div><h1>Привет, '+esc(state.user?.firstName||'староста')+'!</h1><div class="sub">'+esc(state.group)+' · '+esc(state.date)+'</div></div><button class="refresh" onclick="load()">↻ Обновить</button></div>'+
'<section class="hero"><div class="eyebrow">'+timingLabel+' · '+lessons.length+' пар сегодня</div><h2>'+esc(focusTitle)+'</h2><p>'+esc(focusMeta)+'</p><div class="hero-bottom"><span>'+(timing.kind==='current'?'⏳ До конца: '+durationLabel(timing.minutes):timing.kind==='next'?'⏰ Начнётся через '+durationLabel(timing.minutes):'📚 Староста Бот')+'</span><span>'+esc(state.group)+'</span></div></section>'+
'<div class="stats"><div class="stat"><span>👥 Студентов</span><b>'+(state.students||[]).length+'</b></div><div class="stat"><span>✅ Отмечено</span><b>'+(t.present+t.absent)+'</b></div><div class="stat"><span>📈 Присутствуют</span><b>'+pct+'%</b></div></div>'+
'<div class="quick-actions"><button class="quick-action" onclick="setTab(\'attendance\')"><span>✓</span><b>Посещаемость</b><small>Отметить пару</small></button><button class="quick-action" onclick="setTab(\'news\')"><span>📢</span><b>Объявления</b><small>Сообщить группе</small></button></div>'+
'<div class="section-title">Расписание на сегодня <button class="softbtn" onclick="setTab(\'schedule\')">Все пары →</button></div>'+lessonCards()+
(lesson?'<div class="section-title">Посещаемость выбранной пары</div><div class="card"><div class="headrow"><b>'+t.present+' из '+t.total+' присутствуют</b><span class="muted">'+pct+'%</span></div><div class="progress"><i style="width:'+pct+'%"></i></div><p class="muted">'+t.absent+' отсутствуют · '+t.unmarked+' не отмечены</p><button class="softbtn" onclick="setTab(\'attendance\')">Открыть посещаемость →</button></div>':'')+
'<div class="section-title">Последние объявления <button class="softbtn" onclick="setTab(\'news\')">Все →</button></div>'+(recent.length?recent.map(x=>'<article class="card home-announcement"><div class="muted">'+esc(new Date(x.createdAt).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}))+'</div><div class="announcement-text">'+esc(x.text)+'</div></article>').join(''):'<div class="empty">Новых объявлений пока нет.</div>')}function scheduleDateLabel(value){const p=String(value||'').split('-').map(Number);if(p.length!==3||!p[0])return value||'Дата не указана';const d=new Date(p[0],p[1]-1,p[2]);return d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}
function scheduleView(){const all=state.scheduleLessons||state.lessons||[],today=state.date,base=new Date(today+'T00:00:00'),tomorrow=new Date(base);tomorrow.setDate(tomorrow.getDate()+1);const tomorrowKey=tomorrow.getFullYear()+'-'+String(tomorrow.getMonth()+1).padStart(2,'0')+'-'+String(tomorrow.getDate()).padStart(2,'0');const visible=all.filter(x=>scheduleRange==='today'?x.date===today:scheduleRange==='tomorrow'?x.date===tomorrowKey:x.date>=today);const grouped={};visible.forEach(x=>(grouped[x.date]||= []).push(x));const tabs=[['today','Сегодня'],['tomorrow','Завтра'],['week','Неделя']];const cards=Object.keys(grouped).sort().map(date=>'<div class="section-title">📅 '+esc(scheduleDateLabel(date))+' <span class="muted">'+grouped[date].length+' пар</span></div><div class="lesson-list">'+grouped[date].map(x=>'<article class="lesson"><div class="time">'+esc(x.timeStart||'—')+(x.timeEnd?'<small style="display:block;color:var(--muted);font-weight:500">'+esc(x.timeEnd)+'</small>':'')+'</div><div class="lesson-info"><b>'+esc(x.subject)+'</b><small>🚪 '+esc(x.room||'Аудитория не указана')+(x.teacher?' · 👨‍🏫 '+esc(x.teacher):'')+'</small></div></article>').join('')+'</div>').join('');return '<h1>Расписание</h1><div class="sub">'+esc(state.group)+' · обновлено вместе с данными кабинета</div><div class="tabs" style="margin-top:16px">'+tabs.map(([v,label])=>'<button class="tab '+(scheduleRange===v?'active':'')+'" onclick="setScheduleRange(\''+v+'\')">'+label+'</button>').join('')+'</div>'+ (state.scheduleError?'<div class="empty">⚠️ '+esc(state.scheduleError)+'</div>':'')+(cards||'<div class="empty">На выбранный период занятий нет. Попробуй другой период или обнови расписание.</div>')+'<button class="softbtn" style="margin-top:16px" onclick="load()">↻ Обновить расписание</button>'}
function attendanceView(){const lesson=getLesson();if(!lesson)return '<h1>Посещаемость</h1><div class="empty">Нет пар для отметки. Когда расписание загрузится, здесь появится список занятий.</div>';const t=totals(lesson.key),pct=t.total?Math.round(t.present/t.total*100):0;return '<h1>Посещаемость</h1><div class="sub">Выбери занятие и отметь студентов</div><div class="section-title">Пары сегодня</div><div class="tabs">'+(state.lessons||[]).map(x=>'<button class="tab '+(x.key===selectedKey?'active':'')+'" onclick="choose(\''+encodeURIComponent(x.key)+'\')">'+esc(x.timeStart||'—')+' · '+esc(x.subject)+'</button>').join('')+'</div><div class="card"><div class="headrow"><b>'+esc(lesson.subject)+'</b><span class="muted">'+esc(lesson.timeStart||'')+'</span></div><div class="muted">'+esc(lesson.room||'Аудитория не указана')+'</div><div class="progress"><i style="width:'+pct+'%"></i></div><div class="stats"><div class="stat"><span>Присутствуют</span><b>'+t.present+'</b></div><div class="stat"><span>Отсутствуют</span><b>'+t.absent+'</b></div><div class="stat"><span>Не отмечены</span><b>'+t.unmarked+'</b></div></div><div class="muted">'+pct+'% группы отмечено как присутствующие</div></div><div class="section-title">Список группы <span class="muted">'+t.total+' студентов</span></div><div class="tabs">'+[['all','Все'],['unmarked','Не отмечены'],['present','Присутствуют'],['absent','Отсутствуют']].map(([v,label])=>'<button class="tab '+(attendanceFilter===v?'active':'')+'" onclick="setAttendanceFilter(\''+v+'\')">'+label+'</button>').join('')+'</div>'+studentRows((state.students||[]).filter(s=>attendanceFilter==='all'||statusOf(s,lesson.key)===attendanceFilter),lesson.key)}
function studentRows(list,key){return list.length?list.map(s=>{const st=statusOf(s,key);return '<div class="student"><div style="min-width:0"><div class="student-name">'+esc(s.name)+'</div><div class="student-meta">'+(st==='present'?'Присутствует':st==='absent'?'Отсутствует':'Ожидает отметки')+'</div></div><div class="actions"><button aria-label="Отметить присутствие" class="yes '+(st==='present'?'on':'')+'" onclick="mark('+s.index+',\'present\')">✓</button><button aria-label="Отметить отсутствие" class="no '+(st==='absent'?'on':'')+'" onclick="mark('+s.index+',\'absent\')">✕</button>'+(st!=='unmarked'?'<button aria-label="Сбросить отметку" onclick="mark('+s.index+',\'unmarked\')">↶</button>':'')+'</div></div>'}).join(''):'<div class="empty">Список пуст или нет студентов в выбранной категории.</div>'}
function studentsView(){const all=state.students||[],q=studentQuery.trim().toLowerCase(),list=all.filter(s=>String(s.name||'').toLowerCase().includes(q)||String(s.username||'').toLowerCase().includes(q));return '<h1>Студенты</h1><div class="sub">'+esc(state.group)+' · '+all.length+' человек</div><input class="search" placeholder="Поиск по имени или username" value="'+esc(studentQuery)+'" oninput="searchStudents(this.value)"><div class="section-title">Список группы <span class="muted">'+list.length+' найдено</span></div>'+(list.length?list.map(s=>'<div class="student"><div style="min-width:0"><div class="student-name">'+esc(s.name)+'</div><div class="student-meta">'+(s.username?'@'+esc(s.username):'Username не указан')+'</div></div><span class="muted">#'+esc(s.index)+'</span></div>').join(''):'<div class="empty">Ничего не найдено.</div>')}
function newsView(){const items=state.announcements||[];return '<h1>Объявления</h1><div class="sub">Сообщения для участников учебной группы</div><div class="card"><b>📢 Новое объявление</b><textarea id="announcementText" class="search announce-input" maxlength="3000" placeholder="Напиши важную информацию для группы…" rows="5"></textarea><div class="headrow"><span class="muted">До 3000 символов</span><button class="softbtn" onclick="publishAnnouncement()">Отправить в группу ↗</button></div></div><div class="section-title">История объявлений <span class="muted">'+items.length+'</span></div>'+(items.length?items.map(x=>'<article class="card"><div class="headrow"><b>📢 Объявление</b><span class="muted">'+esc(new Date(x.createdAt).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}))+'</span></div><div class="announcement-text">'+esc(x.text)+'</div><div class="muted" style="margin-top:10px">Автор: '+esc(x.authorName||'Староста')+'</div></article>').join(''):'<div class="empty">Пока объявлений нет. Создай первое сообщение для группы.</div>')}
function profileView(){return '<h1>Профиль</h1><div class="sub">Информация о кабинете</div><div class="card"><div class="eyebrow">Пользователь</div><h2 style="margin:7px 0">'+esc(state.user?.firstName||'Пользователь')+'</h2><div class="muted">'+(state.user?.username?'@'+esc(state.user.username):'Telegram username не указан')+'</div></div><div class="card"><div class="eyebrow">Учебная группа</div><h2 style="margin:7px 0">'+esc(state.group)+'</h2><div class="muted">Дата данных: '+esc(state.date)+'</div></div><div class="card"><div class="eyebrow">Данные кабинета</div><p>Студенты: <b>'+(state.students||[]).length+'</b></p><p>Пар сегодня: <b>'+(state.lessons||[]).length+'</b></p><button class="softbtn" onclick="load()">↻ Обновить данные</button></div><div class="footer">Староста Бот · изменения посещаемости сохраняются в общей базе бота.</div>'}
function render(){if(!state)return;const views={home:homeView,schedule:scheduleView,attendance:attendanceView,students:studentsView,news:newsView,profile:profileView};root.innerHTML=views[currentTab]();document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab))}
window.setTab=tab=>{currentTab=tab;document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()};
window.setScheduleRange=value=>{scheduleRange=value;render();haptic('light')};
window.choose=encoded=>{try{selectedKey=decodeURIComponent(encoded)}catch{selectedKey=encoded}render()};
window.searchStudents=value=>{studentQuery=value;const pos=document.querySelector('.search')?.selectionStart;render();const el=document.querySelector('.search');if(el){el.focus();el.setSelectionRange(pos??value.length,pos??value.length)}};
window.setAttendanceFilter=value=>{attendanceFilter=value;render()};
window.publishAnnouncement=async()=>{const field=document.getElementById('announcementText');const textValue=String(field?.value||'').trim();if(!textValue){toast('Сначала напиши текст объявления','error');return}if(textValue.length>3000){toast('Максимум 3000 символов','error');return}if(window.__publishingAnnouncement)return;window.__publishingAnnouncement=true;try{const result=await api('/api/announcements',{method:'POST',body:JSON.stringify({text:textValue})});state.announcements=state.announcements||[];state.announcements.unshift(result.announcement);render();toast('Объявление отправлено в группу');haptic('medium')}catch(e){toast(e.message,'error')}finally{window.__publishingAnnouncement=false}};
window.mark=async(index,status)=>{if(saving)return;saving=true;haptic('light');try{await api('/api/attendance',{method:'POST',body:JSON.stringify({studentIndex:index,lessonKey:selectedKey,status})});const s=state.students.find(x=>x.index===index);if(s){s.statuses=s.statuses||{};s.statuses[selectedKey]=status;render();toast(status==='present'?'Отмечено присутствие':status==='absent'?'Отмечено отсутствие':'Отметка сброшена')}}catch(e){toast(e.message,'error')}finally{saving=false}};
window.load=async(silent=false)=>{if(loading||saving)return;loading=true;console.log('[miniapp] load started');if(!state)root.innerHTML='<div class="loader"><div class="spinner"></div>Загружаем кабинет…<div id="load-stage" style="margin-top:12px;font-size:12px">JavaScript запущен</div></div>';try{setDiagnostic('Инициализация Telegram…');if(!await waitForTelegram())throw new Error('Не удалось подключить Telegram WebApp. Открой кабинет через кнопку в боте.');if(!tg?.initData)throw new Error('Telegram WebApp подключён, но initData отсутствует.');const fresh=await api('/api/data');state=fresh;setDiagnostic('Данные кабинета получены');if(window.__scheduleRetryTimer)clearTimeout(window.__scheduleRetryTimer);if(state.scheduleLoading)window.__scheduleRetryTimer=setTimeout(()=>{if(document.visibilityState==='visible')load(true)},3500);if(!selectedKey||!(state.lessons||[]).some(x=>x.key===selectedKey))selectedKey=state.lessons?.[0]?.key;render();if(state.scheduleError)toast(state.scheduleError,'error');else if(!silent)toast('Данные обновлены')}catch(e){console.error('[miniapp] load failed at',window.__miniAppStage||'unknown',e?.message||e);if(state)toast('Не удалось обновить данные: '+e.message,'error');else showError(e.message)}finally{loading=false}};
function showError(message){const sdk=Boolean(window.Telegram?.WebApp),hasData=Boolean(window.Telegram?.WebApp?.initData);root.innerHTML='<div class="error">⚠️ '+esc(message)+'</div><div class="card muted">Диагностика: Telegram SDK — '+(sdk?'подключён':'не найден')+'; данные авторизации — '+(hasData?'получены':'не получены')+'. Сами данные авторизации не отображаются.</div><p><button class="refresh" onclick="load()">Попробовать снова</button></p>'}
document.querySelectorAll('.navitem').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
let lastAutoRefresh=0;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state&&Date.now()-lastAutoRefresh>15000){lastAutoRefresh=Date.now();load(true)}});
window.addEventListener('online',()=>{if(state)load(true)});
setInterval(()=>{if(document.visibilityState==='visible'&&state&&!document.querySelector('#announcementText:focus'))load(true)},120000);
load();
</script></body></html>
